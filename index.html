{g:"OBG",l:"EN",t:"Obstetrics",q:"Which uterotonic does WHO recommend for preventing postpartum haemorrhage at every birth?",o:["Misoprostol 800 µg rectally","Ergometrine 0.5 mg IV","Oxytocin 10 IU IM or IV","Carboprost 250 µg IM","Dinoprostone"],a:2,e:"Oxytocin 10 IU is the first choice. Heat-stable carbetocin or misoprostol are alternatives where oxytocin quality cannot be assured.",r:"WHO recommendations: uterotonics for the prevention of PPH (2018)"},
{g:"OBG",l:"EN",t:"Obstetrics",q:"When should tranexamic acid be given for postpartum haemorrhage?",o:["Only after all uterotonics fail, at any time","1 g IV over 10 min, as early as possible and within 3 hours of birth","2 g orally within 24 hours","Only if coagulopathy is confirmed","Never, because of thrombosis risk"],a:1,e:"WOMAN trial: early IV TXA reduces death from bleeding. A second dose can be given if bleeding continues after 30 minutes.",r:"WHO recommendation on tranexamic acid for PPH (2017)"},
{g:"OBG",l:"FR",t:"Obstétrique",q:"La pré-éclampsie est définie par :",o:["Une HTA préexistante à la grossesse","Une HTA ≥ 140/90 mmHg apparue après 20 SA associée à une protéinurie ≥ 0,3 g/24 h (ou une atteinte d'organe)","Une protéinurie isolée au 1er trimestre","Des œdèmes des membres inférieurs isolés","Une HTA apparue après l'accouchement uniquement"],a:1,e:"La pré-éclampsie est une HTA gravidique après 20 SA avec protéinurie ou atteinte d'organe (rein, foie, plaquettes, neurologique, fœtale). Seul l'accouchement la guérit.",r:"ISSHP 2021 classification; CNGOF"},
{g:"OBG",l:"EN",t:"Obstetrics",q:"A woman on magnesium sulfate for severe pre-eclampsia has absent patellar reflexes and a respiratory rate of 10/min. What is the antidote?",o:["Naloxone","Calcium gluconate 1 g IV (10 mL of 10%)","Protamine","Flumazenil","Atropine"],a:1,e:"Stop the magnesium and give IV calcium gluconate. Monitor reflexes, respiratory rate (above 16/min) and urine output (above 30 mL/h).",r:"WHO recommendations: pre-eclampsia and eclampsia (2011)"},
{g:"OBG",l:"EN",t:"Obstetrics",q:"A woman with chronic hypertension and pre-eclampsia in a previous pregnancy books at 10 weeks. What reduces her risk of pre-eclampsia?",o:["Low-dose aspirin (75–150 mg/day) from 12 weeks until birth","Diuretics","Bed rest","Salt restriction","Vitamin C and E"],a:0,e:"Low-dose aspirin, started before 16 weeks in women at high risk, reduces pre-eclampsia. WHO also recommends calcium supplements where dietary intake is low.",r:"WHO recommendations on antiplatelet agents (2021); ASPRE trial"},
{g:"OBG",l:"FR",t:"Obstétrique",q:"Quel est le test recommandé pour le dépistage du diabète gestationnel entre 24 et 28 SA ?",o:["Glycémie capillaire post-prandiale unique","HGPO à 75 g de glucose","HbA1c","Glycosurie à la bandelette","Test de O'Sullivan à 100 g"],a:1,e:"HGPO 75 g. Seuils OMS 2013 : à jeun ≥ 5,1 mmol/L, 1 h ≥ 10,0, 2 h ≥ 8,5 ; une seule valeur suffit au diagnostic.",r:"WHO 2013 Diagnostic criteria for hyperglycaemia first detected in pregnancy"},
{g:"OBG",l:"EN",t:"Obstetrics",q:"A woman at 31 weeks is in preterm labour. Which antenatal corticosteroid regimen is correct?",o:["Hydrocortisone 100 mg IV once","Dexamethasone 6 mg IM every 12 h × 4 doses","Prednisolone 40 mg orally for 5 days","Betamethasone 12 mg IM once only","Methylprednisolone 1 g IV"],a:1,e:"WHO recommends antenatal corticosteroids from 24 to 34 weeks. Betamethasone 12 mg IM × 2 doses 24 hours apart is also correct.",r:"WHO recommendations on antenatal corticosteroids (2022)"},
{g:"OBG",l:"EN",t:"Obstetrics",q:"What is the minimum number of antenatal care contacts in the WHO 2016 model?",o:["4","6","8","10","12"],a:2,e:"Eight contacts, with the first before 12 weeks.",r:"WHO recommendations on antenatal care for a positive pregnancy experience (2016)"},
{g:"OBG",l:"EN",t:"Obstetrics",q:"A woman with epilepsy plans a pregnancy. Which antiepileptic drug carries the highest risk of neural tube defects and other major malformations?",o:["Lamotrigine","Levetiracetam","Sodium valproate","Carbamazepine at low dose","Clonazepam"],a:2,e:"Valproate carries about a 10% risk of major malformations, including spina bifida, plus neurodevelopmental effects. Avoid it where possible, and give high-dose folic acid before conception.",r:"MHRA/EMA Valproate pregnancy prevention programme"},
{g:"OBG",l:"EN",t:"Obstetrics",q:"Which antibiotic should be avoided throughout pregnancy because it stains fetal teeth and affects bone growth?",o:["Amoxicillin","Cephalexin","Tetracycline (doxycycline)","Erythromycin","Nitrofurantoin in the 2nd trimester"],a:2,e:"Tetracyclines are contraindicated in pregnancy. Penicillins and cephalosporins are safe. Nitrofurantoin is avoided near term.",r:"BNF: Prescribing in pregnancy"},
{g:"OBG",l:"EN",t:"Obstetrics",q:"Which twin pregnancy is at risk of twin-to-twin transfusion syndrome?",o:["Dichorionic diamniotic","Monochorionic diamniotic","Dizygotic twins","Any twins conceived by IVF","Twins with separate placentas"],a:1,e:"TTTS comes from vascular connections in a shared (monochorionic) placenta. It needs ultrasound every 2 weeks from 16 weeks.",r:"ISUOG 2016 Twin pregnancy guideline"},
{g:"OBG",l:"FR",t:"Obstétrique",q:"Quel type de bassin est le plus favorable à l'accouchement par voie basse ?",o:["Bassin androïde","Bassin gynécoïde","Bassin anthropoïde","Bassin platypelloïde (aplati)","Bassin asymétrique"],a:1,e:"Le bassin gynécoïde, à détroit supérieur arrondi, est le plus fréquent et le plus favorable.",r:"Williams Obstetrics; Collège CNGOF"},
{g:"OBG",l:"EN",t:"Obstetrics",q:"Which of these is NOT part of the Bishop score?",o:["Cervical dilatation","Cervical effacement (length)","Station of the presenting part","Cervical consistency","Fetal heart rate"],a:4,e:"Bishop score components: dilatation, effacement, station, consistency and position of the cervix. A score of 8 or more is favourable for induction.",r:"ACOG Practice Bulletin 107 Induction of labour"},
{g:"OBG",l:"EN",t:"Obstetrics",q:"The head delivers and then retracts against the perineum (the 'turtle sign'). What is the first manoeuvre?",o:["Zavanelli manoeuvre","Fundal pressure","McRoberts manoeuvre with suprapubic pressure","Deliberate clavicle fracture","Symphysiotomy"],a:2,e:"For shoulder dystocia, call for help, do McRoberts with suprapubic pressure, then internal manoeuvres. Never apply fundal pressure.",r:"RCOG Green-top 42 Shoulder dystocia"},
{g:"OBG",l:"EN",t:"Obstetrics",q:"An Rh(D)-negative woman delivers an Rh(D)-positive baby. What should she receive, and when?",o:["Nothing if it is her first baby","Anti-D immunoglobulin within 72 hours of delivery","Anti-D only in the next pregnancy","IV immunoglobulin to the baby","Rh-negative blood transfusion"],a:1,e:"Anti-D within 72 hours prevents alloimmunisation. A Kleihauer test guides extra doses after a large fetomaternal haemorrhage.",r:"BSH 2014 Anti-D guideline; ACOG PB 181"},
{g:"OBG",l:"FR",t:"Obstétrique",q:"Menace d'accouchement prématuré à 30 SA. Quel tocolytique est recommandé en première intention ?",o:["Sulfate de magnésium","Nifédipine (inhibiteur calcique) ou atosiban","Salbutamol IV à forte dose","Indométacine au 3e trimestre","Progestérone IV"],a:1,e:"La nifédipine ou l'atosiban, pendant 48 h, permettent la corticothérapie anténatale et un éventuel transfert in utero. Le MgSO4 avant 32 SA sert à la neuroprotection fœtale, pas à la tocolyse.",r:"CNGOF 2016 Prévention de la prématurité spontanée"},
{g:"OBG",l:"EN",t:"Gynaecology",q:"A 28-year-old has 8 months of amenorrhoea and galactorrhoea, with a negative pregnancy test. What is the most useful first blood test?",o:["FSH","Serum prolactin (and TSH)","Oestradiol","Testosterone","Cortisol"],a:1,e:"Hyperprolactinaemia (prolactinoma, drugs, hypothyroidism) suppresses GnRH. Prolactinomas are treated with cabergoline.",r:"Endocrine Society 2011 Hyperprolactinemia guideline"},
{g:"OBG",l:"EN",t:"Gynaecology",q:"After a massive postpartum haemorrhage with shock, a woman cannot breastfeed and her periods do not return. What is the diagnosis?",o:["Asherman syndrome","Sheehan syndrome (postpartum pituitary necrosis)","Polycystic ovary syndrome","Premature ovarian insufficiency","Prolactinoma"],a:1,e:"Ischaemic necrosis of the pituitary causes hypopituitarism. Lactation failure is often the first sign. Replace cortisol before thyroxine.",r:"Endocrine Society Hypopituitarism guideline (2016)"},
{g:"OBG",l:"EN",t:"Gynaecology",q:"How are the Rotterdam criteria for polycystic ovary syndrome met?",o:["All three: oligo-anovulation, hyperandrogenism and polycystic ovaries","Any two of the three, after excluding other causes","Hyperandrogenism alone","A raised LH:FSH ratio","Obesity with insulin resistance"],a:1,e:"Rotterdam criteria need two of three features, after excluding thyroid disease, hyperprolactinaemia and congenital adrenal hyperplasia.",r:"International PCOS Guideline (2023)"},
{g:"OBG",l:"FR",t:"Gynécologie",q:"Pertes vaginales grisâtres, fluides, malodorantes (odeur de poisson avariée), sans prurit, test à la potasse positif. Quel est le traitement ?",o:["Fluconazole","Métronidazole","Ceftriaxone","Doxycycline","Aciclovir"],a:1,e:"Vaginose bactérienne (Gardnerella vaginalis, clue-cells) : métronidazole oral 500 mg × 2/j pendant 7 jours. Le partenaire n'est pas traité.",r:"WHO 2021 Guidelines for management of symptomatic STIs; CDC STI 2021"},
{g:"OBG",l:"EN",t:"Gynaecology",q:"A woman has a frothy yellow-green offensive vaginal discharge, vulval itching and a 'strawberry' cervix. What is the organism?",o:["Candida albicans","Gardnerella vaginalis","Trichomonas vaginalis","Neisseria gonorrhoeae","Group B streptococcus"],a:2,e:"Trichomoniasis is treated with metronidazole, and sexual partners must be treated too.",r:"CDC STI Treatment Guidelines 2021"},
{g:"OBG",l:"EN",t:"Gynaecology",q:"Uterine evacuation for a 'snowstorm' ultrasound appearance shows a complete hydatidiform mole. What is its usual karyotype?",o:["69,XXY","46,XX, entirely paternal","47,XXY","46,XX, biparental","45,X"],a:1,e:"A complete mole comes from an empty ovum fertilised by sperm. Follow with serial β-hCG to detect gestational trophoblastic neoplasia.",r:"FIGO 2021 Gestational trophoblastic disease"},
{g:"OBG",l:"FR",t:"Gynécologie",q:"Rapport sexuel non protégé il y a 4 jours. Quelle méthode de contraception d'urgence est la plus efficace ?",o:["Lévonorgestrel 1,5 mg","Dispositif intra-utérin au cuivre","Pilule œstroprogestative (méthode de Yuzpe)","Préservatif","Spermicide"],a:1,e:"Le DIU au cuivre, posé dans les 5 jours, est la méthode la plus efficace (> 99 %). Le lévonorgestrel s'utilise jusqu'à 72 h, l'ulipristal jusqu'à 120 h.",r:"WHO Emergency contraception fact sheet; FSRH 2017"},
// ---- SURGERY & SURGICAL SPECIALTIES ----
{g:"SUR",l:"EN",t:"General surgery",q:"A 60-year-old with a previous laparotomy has colicky abdominal pain, vomiting, distension and no flatus. X-ray shows dilated small bowel loops with air-fluid levels. What is the most likely cause?",o:["Colorectal cancer","Adhesions","Gallstone ileus","Volvulus of the caecum","Crohn's stricture"],a:1,e:"Adhesions from previous surgery are the leading cause of small bowel obstruction in adults. Without strangulation, start with 'drip and suck'.",r:"Bologna 2017 Adhesive small bowel obstruction guideline (WSES)"},
{g:"SUR",l:"FR",t:"Chirurgie digestive",q:"Homme de 70 ans : hernie inguinale devenue douloureuse, tendue et irréductible depuis 8 heures, avec vomissements. Quelle est la conduite ?",o:["Réduction manuelle forcée puis retour à domicile","Chirurgie en urgence","Antalgiques et réévaluation dans 48 h","Échographie programmée","Port d'un bandage herniaire"],a:1,e:"Une hernie étranglée est une urgence chirurgicale : risque de nécrose de l'anse. Il faut vérifier la vitalité intestinale au bloc.",r:"HerniaSurge 2018 International guidelines"},
{g:"SUR",l:"EN",t:"General surgery",q:"Which laboratory threshold supports the diagnosis of acute pancreatitis?",o:["Serum lipase or amylase at least 3 times the upper limit of normal","Any rise in amylase","ALT above 1,000 U/L","CRP above 50 mg/L","Calcium above 3 mmol/L"],a:0,e:"Diagnosis needs 2 of 3: typical pain, lipase or amylase ≥ 3× ULN, and characteristic imaging. Gallstones and alcohol are the main causes.",r:"Revised Atlanta classification (2012); IAP/APA 2013"},
{g:"SUR",l:"EN",t:"General surgery",q:"A patient with a history of NSAID use has sudden severe epigastric pain and a rigid abdomen. What is the most useful first imaging?",o:["Abdominal ultrasound","Erect chest X-ray looking for free air under the diaphragm","Barium swallow","MRI abdomen","Upper endoscopy"],a:1,e:"Perforated peptic ulcer shows pneumoperitoneum on an erect CXR. CT is more sensitive when available. Endoscopy is contraindicated.",r:"WSES 2020 Perforated and bleeding peptic ulcer guideline"},
{g:"SUR",l:"FR",t:"Chirurgie digestive",q:"Fièvre, douleur de l'hypochondre droit avec signe de Murphy positif ; l'échographie montre une vésicule lithiasique à paroi épaissie. Quel est le traitement de référence ?",o:["Antalgiques seuls","Antibiothérapie et cholécystectomie précoce (idéalement dans les 72 h)","CPRE systématique","Acide ursodésoxycholique","Lithotritie extracorporelle"],a:1,e:"La cholécystite aiguë lithiasique se traite par cholécystectomie cœlioscopique précoce associée à une antibiothérapie.",r:"Tokyo Guidelines 2018; WSES 2020"},
{g:"SUR",l:"EN",t:"General surgery",q:"An elderly man has marked abdominal distension and constipation. X-ray shows a large 'coffee bean' loop arising from the pelvis. There are no signs of peritonitis. What is the initial treatment?",o:["Immediate laparotomy","Endoscopic decompression by flexible sigmoidoscopy","Oral laxatives","Barium enema","Observation only"],a:1,e:"Sigmoid volvulus without ischaemia is decompressed endoscopically, usually followed by elective sigmoid resection because recurrence is common.",r:"WSES 2023 Colonic volvulus guideline; ASCRS 2021"},
{g:"SUR",l:"EN",t:"Vascular",q:"A 75-year-old in atrial fibrillation has sudden severe abdominal pain 'out of proportion' to a soft abdomen, with high lactate. What is the best investigation?",o:["Plain abdominal X-ray","CT angiography of the abdomen","Colonoscopy","Abdominal ultrasound","Serum amylase"],a:1,e:"Acute mesenteric ischaemia (embolic, given AF) is diagnosed by CT angiography. Revascularisation or resection is urgent.",r:"ESVS 2017 Mesenteric arterial disease guideline"},
{g:"SUR",l:"FR",t:"Chirurgie digestive",q:"Diverticulite sigmoïdienne avec un abcès péricolique de 5 cm au scanner, patient stable. Quelle prise en charge ?",o:["Colectomie en urgence avec colostomie","Antibiothérapie IV et drainage percutané radioguidé","Antibiothérapie orale ambulatoire seule","Coloscopie en urgence","Laxatifs et régime riche en fibres"],a:1,e:"Un abcès de plus de 3–4 cm (Hinchey Ib–II) se draine par voie percutanée sous antibiotiques. La chirurgie en urgence est réservée à la péritonite.",r:"WSES 2020 Acute left colonic diverticulitis; HAS 2017"},
{g:"SUR",l:"EN",t:"Endocrine surgery",q:"A euthyroid 40-year-old woman has a solitary 2 cm thyroid nodule. What is the most appropriate initial workup?",o:["Radio-iodine therapy","TSH and neck ultrasound, then fine-needle aspiration if suspicious features","Total thyroidectomy immediately","Serum calcitonin only","CT neck"],a:1,e:"TSH and ultrasound come first. FNA is guided by ultrasound risk features and size, and cytology is reported using Bethesda categories.",r:"ATA 2015 Thyroid nodule guideline"},
{g:"SUR",l:"EN",t:"Endocrine surgery",q:"On the day after total thyroidectomy, a patient has perioral tingling, carpopedal spasm and a positive Chvostek sign. What is the treatment?",o:["IV potassium","IV calcium gluconate","Levothyroxine","IV magnesium only","Reassurance"],a:1,e:"Hypocalcaemia from parathyroid injury or devascularisation. Give IV calcium gluconate if symptomatic, then oral calcium and calcitriol.",r:"British Association of Endocrine and Thyroid Surgeons"},
{g:"SUR",l:"EN",t:"Breast",q:"What does 'triple assessment' of a breast lump consist of?",o:["Mammography, MRI and PET","Clinical examination, imaging (ultrasound or mammography) and core needle biopsy","Tumour markers, CT and bone scan","Examination, FNA and CA 15-3","Surgery, radiotherapy and chemotherapy"],a:1,e:"Clinical assessment, age-appropriate imaging and histology or cytology are combined to reach a diagnosis.",r:"NICE NG101; ESMO early breast cancer guideline"},
{g:"SUR",l:"FR",t:"Gastro-entérologie",q:"Hématémèse avec méléna chez un homme de 55 ans sous AINS. Après réanimation, quel examen réaliser dans les 24 heures ?",o:["Scanner abdominal","Endoscopie œso-gastro-duodénale","Coloscopie","Échographie abdominale","Transit baryté"],a:1,e:"L'endoscopie haute, idéalement dans les 24 h, est diagnostique et thérapeutique. On y associe un IPP IV. Les scores de Glasgow-Blatchford et de Rockall évaluent le risque.",r:"ESGE 2021 Non-variceal upper GI haemorrhage guideline"},
{g:"SUR",l:"EN",t:"Surgical principles",q:"What is the correct order of the phases of wound healing?",o:["Inflammation, haemostasis, remodelling, proliferation","Haemostasis, inflammation, proliferation, remodelling","Proliferation, inflammation, haemostasis, remodelling","Remodelling, proliferation, inflammation, haemostasis","Haemostasis, proliferation, inflammation, remodelling"],a:1,e:"Coagulum formation comes first, then an inflammatory infiltrate, then fibroblasts and angiogenesis (granulation tissue), then collagen remodelling over months.",r:"Bailey & Love's Short Practice of Surgery"},
{g:"SUR",l:"EN",t:"Trauma",q:"A trauma patient has a pulse of 130, BP 80/50, respiratory rate 32, is confused and has low urine output. What is his estimated blood loss (ATLS class)?",o:["Class I: under 15%","Class II: 15–30%","Class III: 30–40%","Class IV: over 40%","No significant blood loss"],a:2,e:"Class III shows tachycardia over 120, hypotension, tachypnoea, confusion and oliguria. He needs blood products and haemorrhage control.",r:"ATLS 10th edition"},
{g:"SUR",l:"EN",t:"Trauma",q:"In a bleeding trauma patient with ongoing haemorrhagic shock, what is the best resuscitation strategy?",o:["Several litres of crystalloid before any blood","Early balanced blood products (plasma, platelets and red cells, about 1:1:1) and haemorrhage control","Albumin only","Hypertonic dextrose","Vasopressors instead of volume"],a:1,e:"Damage-control resuscitation limits crystalloid, uses permissive hypotension and gives balanced blood products plus tranexamic acid within 3 hours.",r:"ATLS 10th ed.; European trauma guideline 2023; CRASH-2"},
{g:"SUR",l:"EN",t:"Orthopaedics",q:"A young man falls on his outstretched hand. He is tender in the anatomical snuffbox, but the initial X-ray is normal. What is the correct management?",o:["Discharge with analgesia","Immobilise in a cast or splint and repeat imaging (or MRI)","Physiotherapy immediately","Steroid injection","Open reduction"],a:1,e:"A suspected scaphoid fracture is treated as a fracture until excluded, because of the risk of non-union and avascular necrosis of the proximal pole.",r:"NICE NG38 Fractures (non-complex); BOAST"},
{g:"SUR",l:"EN",t:"Orthopaedics",q:"An elderly woman falls on her outstretched hand and has a 'dinner fork' deformity of the wrist. Which fracture is this?",o:["Smith fracture","Colles fracture (dorsally displaced distal radius)","Barton fracture","Scaphoid fracture","Monteggia fracture"],a:1,e:"A Colles fracture is a distal radius fracture with dorsal angulation, typical of osteoporotic bone. In a Smith fracture the displacement is volar.",r:"Apley & Solomon's System of Orthopaedics"},
{g:"SUR",l:"EN",t:"Orthopaedics",q:"After a tibial fracture treated in a cast, a patient has severe pain out of proportion that worsens on passive stretching of the toes. Pulses are present. What is the definitive treatment?",o:["More analgesia and elevation above the heart","Urgent fasciotomy after removing the cast","Anticoagulation","Observation for 24 hours","Warm compresses"],a:1,e:"Acute compartment syndrome is a surgical emergency. Pulses are often preserved until late, so don't wait for them to disappear. Split the cast and dressings and perform fasciotomy.",r:"BOAST 10 Compartment syndrome"},
{g:"SUR",l:"FR",t:"Orthopédie",q:"Femme de 82 ans : fracture déplacée du col du fémur (Garden IV) après une chute. Quel traitement est habituellement recommandé ?",o:["Traitement orthopédique par traction 3 mois","Arthroplastie (prothèse de hanche)","Vissage simple conservateur","Repos au lit sans chirurgie","Plâtre pelvi-pédieux"],a:1,e:"Chez le sujet âgé, la fracture déplacée du col expose à la nécrose de la tête fémorale : on pose une prothèse (intermédiaire ou totale). La chirurgie dans les 36–48 h réduit la mortalité.",r:"NICE CG124 Hip fracture; SOFCOT"},
{g:"SUR",l:"EN",t:"Orthopaedics",q:"A motorcyclist has an open tibial fracture with bone protruding through the skin. Which step is most urgent to reduce infection?",o:["Primary wound closure in the emergency department","IV antibiotics as soon as possible (within 1 hour), plus tetanus cover","Delay antibiotics until cultures return","Topical antiseptic only","Oral antibiotics after surgery"],a:1,e:"Early IV antibiotics are the most important factor in preventing infection. Then photograph, dress and splint, and do surgical debridement within 12–24 hours.",r:"BOAST 4 Open fractures (2017)"},
{g:"SUR",l:"EN",t:"Orthopaedics",q:"A 6-year-old has a displaced supracondylar fracture of the humerus. Which structure is most at risk?",o:["Axillary nerve","Brachial artery (and median/anterior interosseous nerve)","Radial head","Ulnar collateral ligament","Long thoracic nerve"],a:1,e:"Brachial artery injury can cause Volkmann's ischaemic contracture. Check pulse, perfusion and nerves before and after reduction.",r:"BOAST 11 Supracondylar fractures in children"},
{g:"SUR",l:"EN",t:"Orthopaedics",q:"A 7-year-old has fever, refuses to bear weight and has a hot, swollen knee with raised CRP. What is the most likely organism?",o:["Neisseria gonorrhoeae","Staphylococcus aureus","Salmonella","Mycobacterium tuberculosis","Escherichia coli"],a:1,e:"S. aureus is the leading cause of septic arthritis at all ages (Kingella in toddlers). Treat with urgent aspiration or washout and IV antibiotics.",r:"ESPID 2017 Bone and joint infection guideline"},
{g:"SUR",l:"FR",t:"Orthopédie",q:"Luxation antéro-interne de l'épaule. Quel nerf faut-il examiner avant et après réduction ?",o:["Nerf radial","Nerf axillaire (circonflexe)","Nerf ulnaire","Nerf médian","Nerf musculo-cutané"],a:1,e:"L'atteinte du nerf axillaire donne une hypoesthésie du moignon de l'épaule (région deltoïdienne) et une paralysie du deltoïde.",r:"SOFCOT; Apley & Solomon"},
{g:"SUR",l:"EN",t:"Orthopaedics",q:"Which imaging is most sensitive for early acute osteomyelitis?",o:["Plain X-ray","MRI","Ultrasound","CT","Bone densitometry"],a:1,e:"X-ray changes appear only after 10–14 days. MRI shows marrow oedema early and can show abscesses.",r:"ACR Appropriateness Criteria: suspected osteomyelitis"},
{g:"SUR",l:"EN",t:"Orthopaedics",q:"A man feels a 'kick' at the back of his heel while running. Squeezing his calf produces no plantar flexion. What is the diagnosis?",o:["Ankle sprain","Achilles tendon rupture (positive Simmonds/Thompson test)","Plantar fasciitis","Gastrocnemius strain","Calcaneal fracture"],a:1,e:"Absent plantar flexion on calf squeeze confirms Achilles rupture. Treat with a functional brace or surgery.",r:"BOAST Achilles tendon rupture (2021)"},
{g:"SUR",l:"EN",t:"Spine",q:"A man with low back pain develops saddle anaesthesia, urinary retention and bilateral leg weakness. What is the management?",o:["Analgesia and physiotherapy","Emergency MRI and surgical decompression","Epidural steroid injection","Outpatient MRI in 6 weeks","Bed rest"],a:1,e:"Cauda equina syndrome is a surgical emergency. Early decompression improves bladder and neurological outcomes.",r:"GIRFT/BASS 2023 Cauda equina pathway"},
{g:"SUR",l:"FR",t:"Traumatologie",q:"24 heures après une fracture de la diaphyse fémorale, un jeune homme présente une détresse respiratoire, une confusion et un purpura pétéchial axillaire. Quel est le diagnostic ?",o:["Embolie pulmonaire fibrino-cruorique","Syndrome d'embolie graisseuse","Pneumothorax","Choc hémorragique","Méningite"],a:1,e:"Triade de l'embolie graisseuse : insuffisance respiratoire, troubles neurologiques, pétéchies. L'ostéosynthèse précoce en réduit le risque.",r:"Gurd & Wilson criteria; Apley & Solomon"},
{g:"SUR",l:"EN",t:"Urology",q:"A patient has sudden loin-to-groin colicky pain and microscopic haematuria. Which imaging is the gold standard?",o:["Plain KUB X-ray","Non-contrast CT KUB","IV urogram","MRI","Cystoscopy"],a:1,e:"Non-contrast CT detects almost all stones and their size and position. Use ultrasound first in pregnancy and in children.",r:"EAU 2024 Urolithiasis guideline"},
{g:"SUR",l:"EN",t:"Urology",q:"A patient with an obstructing 6 mm ureteric stone has a fever of 39 °C, rigors and a raised creatinine. What is the priority?",o:["Tamsulosin and discharge","Urgent decompression of the kidney (nephrostomy or ureteric stent) plus IV antibiotics","Extracorporeal shock-wave lithotripsy today","Ureteroscopy with stone fragmentation today","Oral antibiotics alone"],a:1,e:"An infected, obstructed kidney is a urological emergency. Drain it first and treat the stone definitively later.",r:"EAU 2024 Urolithiasis guideline"},
{g:"SUR",l:"FR",t:"Urologie",q:"Adolescent de 15 ans : douleur testiculaire brutale depuis 3 heures, testicule ascensionné, réflexe crémastérien aboli. Quelle est la conduite ?",o:["Échographie Doppler puis décision le lendemain","Exploration chirurgicale immédiate","Antibiotiques pour orchi-épididymite","Antalgiques et surveillance","Scintigraphie testiculaire"],a:1,e:"Suspicion de torsion du cordon spermatique : exploration chirurgicale sans délai (sauvetage testiculaire élevé si < 6 h) avec orchidopexie bilatérale. L'imagerie ne doit pas retarder la chirurgie.",r:"EAU Paediatric urology guideline; AFU"},
{g:"SUR",l:"EN",t:"Urology",q:"A 65-year-old has bothersome urinary frequency, a weak stream and nocturia from benign prostatic hyperplasia. What is the first-line medication?",o:["Alpha-1 blocker (tamsulosin)","Oxybutynin alone","Testosterone","Furosemide","Finasteride for a small prostate"],a:0,e:"Alpha-blockers relax prostatic smooth muscle and work within days. 5-alpha-reductase inhibitors suit large prostates (over 40 mL).",r:"EAU 2024 Non-neurogenic male LUTS guideline"},
{g:"SUR",l:"EN",t:"Urology",q:"A 62-year-old has a PSA of 9 ng/mL on two occasions and a normal rectal examination. What is the recommended next step?",o:["Radical prostatectomy","Multiparametric MRI of the prostate, then targeted biopsy","Bone scan","Hormone therapy","Repeat PSA in 5 years"],a:1,e:"Pre-biopsy MRI improves detection of significant cancer and reduces unnecessary biopsies.",r:"EAU-EANM-ESTRO-ESUR-ISUP-SIOG 2024 Prostate cancer guideline"},
{g:"SUR",l:"EN",t:"Urology",q:"A 60-year-old smoker has painless visible haematuria. Which investigations are required?",o:["Urine culture only","Cystoscopy and CT urography","PSA only","Renal biopsy","Reassurance if it stops"],a:1,e:"Painless visible haematuria in an older smoker is urothelial cancer until proven otherwise. Evaluate the upper tract by CT and the bladder by cystoscopy.",r:"EAU 2024 Non-muscle-invasive bladder cancer guideline"},
{g:"SUR",l:"FR",t:"Urologie",q:"Polytraumatisé avec fracture du bassin, sang au méat urétral et globe vésical. Quelle conduite adopter ?",o:["Sondage urinaire transurétral immédiat","Ne pas sonder ; urétrographie rétrograde, puis cathéter sus-pubien si nécessaire","Cystoscopie rigide","Massage prostatique","Diurétique IV"],a:1,e:"Une lésion de l'urètre postérieur est suspectée : le sondage peut compléter une rupture. On draine par voie sus-pubienne.",r:"EAU 2024 Urological trauma guideline; ATLS"},
{g:"SUR",l:"EN",t:"Urology",q:"Why are varicoceles much more common on the left?",o:["The left testis is larger","The left testicular vein drains at a right angle into the left renal vein","The left testicular artery is longer","There are more valves on the left","The left spermatic cord is shorter"],a:1,e:"The anatomy of the left testicular vein raises venous pressure. A new right-sided or non-reducing varicocele needs imaging to exclude a retroperitoneal mass.",r:"EAU 2024 Sexual and reproductive health guideline"},
{g:"SUR",l:"EN",t:"Neurosurgery",q:"After a blow to the temple, a young man is briefly unconscious, then lucid, then rapidly deteriorates with a dilated ipsilateral pupil. CT shows a biconvex hyperdense collection. Which vessel is usually injured?",o:["Bridging veins","Middle meningeal artery","Middle cerebral artery","Superior sagittal sinus","Basilar artery"],a:1,e:"Extradural haematoma often follows a temporal bone fracture. Urgent craniotomy can save life.",r:"Brain Trauma Foundation; Greenberg's Handbook of Neurosurgery"},
{g:"SUR",l:"EN",t:"Neurosurgery",q:"An 80-year-old on warfarin has 3 weeks of fluctuating confusion after a minor fall. CT shows a crescent-shaped collection over the hemisphere. What is its source?",o:["Middle meningeal artery","Torn bridging veins","Ruptured berry aneurysm","Choroid plexus","Lenticulostriate arteries"],a:1,e:"Chronic subdural haematoma is typical in older people on anticoagulants, whose brain atrophy stretches the bridging veins. Reverse anticoagulation; burr-hole drainage if symptomatic.",r:"Greenberg's Handbook of Neurosurgery"},
{g:"SUR",l:"FR",t:"Neurochirurgie",q:"Céphalée brutale « en coup de tonnerre », la pire de sa vie, avec raideur de nuque. Le scanner cérébral réalisé à 3 heures est normal. Quel examen faut-il ensuite ?",o:["Aucun, rassurer","Ponction lombaire (xanthochromie) ou angioscanner","EEG","Radiographie du crâne","IRM programmée dans un mois"],a:1,e:"Une hémorragie méningée (anévrisme dans 85 % des cas) doit être éliminée. Si le scanner est négatif, on fait une PL et/ou un angioscanner.",r:"AHA/ASA 2023 Aneurysmal SAH guideline"},
{g:"SUR",l:"EN",t:"Neurosurgery",q:"Which of these is NOT a sign of basal skull fracture?",o:["Battle's sign (mastoid bruising)","'Raccoon eyes' (periorbital bruising)","Haemotympanum","CSF rhinorrhoea","Unilateral facial droop from Bell's palsy"],a:4,e:"Basal skull fracture signs are Battle's sign, periorbital ecchymosis, haemotympanum and CSF leak. Don't pass a nasogastric tube through the nose.",r:"ATLS 10th edition"},
{g:"SUR",l:"EN",t:"Neurosurgery",q:"Which triad suggests critically raised intracranial pressure with impending herniation?",o:["Tachycardia, hypotension and fever","Hypertension, bradycardia and irregular respiration (Cushing's triad)","Hypotension, bradycardia and warm peripheries","Hypertension, tachycardia and tachypnoea","Fever, neck stiffness and photophobia"],a:1,e:"Cushing's reflex is a late sign. Immediate measures: head elevation 30°, osmotherapy (mannitol or hypertonic saline) and neurosurgical review.",r:"Brain Trauma Foundation guidelines (4th ed.)"},
{g:"SUR",l:"EN",t:"ENT",q:"Where does most anterior epistaxis come from, and what is the first aid?",o:["Sphenopalatine artery; nasal packing immediately","Little's area (Kiesselbach plexus); pinch the soft nose and lean forward for 10–15 minutes","Posterior ethmoidal artery; lie flat","Maxillary sinus; ice to the neck","Adenoids; tilt the head back"],a:1,e:"About 90% of nosebleeds arise from Little's area. If pressure fails, use silver nitrate cautery, then packing.",r:"ENT UK / BRS epistaxis guidance"},
{g:"SUR",l:"FR",t:"ORL",q:"Diapason : Rinne négatif à gauche et Weber latéralisé à gauche. Quel type de surdité ?",o:["Surdité de perception gauche","Surdité de transmission gauche","Surdité de perception droite","Audition normale","Surdité de transmission droite"],a:1,e:"Dans une surdité de transmission, la conduction osseuse est supérieure à la conduction aérienne (Rinne négatif) et le Weber est latéralisé du côté atteint.",r:"Collège français d'ORL et de chirurgie cervico-faciale"},
{g:"SUR",l:"EN",t:"ENT",q:"A patient has a chronically foul-smelling ear discharge, conductive hearing loss and a retraction pocket with white keratin debris in the attic of the tympanic membrane. What is the diagnosis?",o:["Otitis externa","Cholesteatoma","Otosclerosis","Acute otitis media","Ménière disease"],a:1,e:"Cholesteatoma erodes bone and can cause facial nerve palsy, labyrinthine fistula and intracranial infection. Treatment is surgical.",r:"Scott-Brown's Otorhinolaryngology"},
{g:"SUR",l:"EN",t:"ENT",q:"A patient has a severe unilateral sore throat, a 'hot potato' voice, trismus and deviation of the uvula away from the swollen side. What is the management?",o:["Oral penicillin and discharge","Needle aspiration or incision and drainage plus IV antibiotics","Tonsillectomy immediately under local anaesthesia","Steroids alone","Antiviral treatment"],a:1,e:"Peritonsillar abscess (quinsy) needs drainage and antibiotics that cover streptococci and anaerobes.",r:"ENT UK; Scott-Brown's Otorhinolaryngology"},
{g:"SUR",l:"EN",t:"ENT",q:"A 2-year-old suddenly chokes while eating peanuts and now has unilateral wheeze with reduced air entry on the right. What is the definitive management?",o:["Nebulised salbutamol","Rigid bronchoscopy to remove the foreign body","Oral antibiotics","Chest physiotherapy","Observation"],a:1,e:"Foreign bodies usually lodge in the right main bronchus because it is wider and more vertical. Remove by rigid bronchoscopy under general anaesthesia.",r:"Scott-Brown's; ERS paediatric bronchoscopy"},
{g:"SUR",l:"FR",t:"ORL",q:"Paralysie faciale périphérique brutale et isolée (paralysie de Bell) depuis 24 heures chez l'adulte. Quel traitement améliore la récupération ?",o:["Antibiotiques","Corticothérapie orale débutée dans les 72 heures","Chirurgie de décompression d'emblée","Anticoagulation","Aucun traitement n'est utile"],a:1,e:"La prednisolone précoce améliore la récupération. Il faut aussi protéger la cornée (larmes artificielles, occlusion nocturne).",r:"AAO-HNS 2013 Bell's palsy guideline"},
{g:"SUR",l:"EN",t:"ENT",q:"What is the most common cause of chronic inspiratory stridor in infants, typically worse when lying supine or feeding?",o:["Croup","Laryngomalacia","Epiglottitis","Vocal cord paralysis","Subglottic haemangioma"],a:1,e:"Laryngomalacia usually resolves by 12–24 months. Supraglottoplasty is for severe cases with failure to thrive.",r:"Scott-Brown's Otorhinolaryngology"},
{g:"SUR",l:"EN",t:"Ophthalmology",q:"A 65-year-old woman has a painful red eye, blurred vision with haloes, vomiting, a mid-dilated non-reactive pupil and a stony-hard eye. What is the diagnosis?",o:["Acute conjunctivitis","Acute angle-closure glaucoma","Anterior uveitis","Subconjunctival haemorrhage","Retinal detachment"],a:1,e:"Emergency treatment: IV acetazolamide, topical pilocarpine and beta-blocker, then laser iridotomy to both eyes.",r:"European Glaucoma Society guidelines (2020)"},
{g:"SUR",l:"EN",t:"Ophthalmology",q:"A myopic man has sudden flashes, new floaters and a 'curtain' coming across his vision. What is the most likely diagnosis?",o:["Migraine aura","Rhegmatogenous retinal detachment","Cataract","Open-angle glaucoma","Conjunctivitis"],a:1,e:"This needs same-day ophthalmology referral for repair, ideally before the macula detaches.",r:"Royal College of Ophthalmologists; AAO Preferred Practice Pattern"},
{g:"SUR",l:"FR",t:"Ophtalmologie",q:"Nouveau-né de 3 jours présentant une conjonctivite purulente abondante avec œdème palpébral. Quel germe suspecter en premier ?",o:["Chlamydia trachomatis","Neisseria gonorrhoeae","Adénovirus","Staphylococcus epidermidis","Herpès simplex"],a:1,e:"La conjonctivite gonococcique néonatale (J2–J5) peut perforer la cornée : ceftriaxone IM en dose unique. Chlamydia survient plus tard (J5–J14).",r:"WHO 2021 STI guidelines; CDC 2021"},
{g:"SUR",l:"EN",t:"Ophthalmology",q:"A diabetic patient has new vessels on the optic disc (proliferative diabetic retinopathy). What is the standard treatment?",o:["Observation only","Panretinal laser photocoagulation and/or intravitreal anti-VEGF","Oral steroids","Cataract surgery","Eye patching"],a:1,e:"PRP or anti-VEGF reduces the risk of vitreous haemorrhage and blindness. Diabetic patients need yearly retinal screening.",r:"ICO Guidelines for diabetic eye care (2017)"},
{g:"SUR",l:"EN",t:"Ophthalmology",q:"A worker gets cement (an alkali) splashed in his eye. What is the first action?",o:["Transfer to an eye hospital without treatment","Immediate copious irrigation with water or saline for at least 30 minutes","Instil antibiotic drops only","Patch the eye","Neutralise with an acid solution"],a:1,e:"Alkali burns penetrate deeply. Irrigate immediately until the pH is neutral, then refer urgently.",r:"Royal College of Emergency Medicine; AAO"},
{g:"SUR",l:"FR",t:"Ophtalmologie",q:"Quelle est la première cause de cécité réversible dans le monde, et en Asie du Sud-Est ?",o:["Glaucome","Cataracte","Trachome","Rétinopathie diabétique","Dégénérescence maculaire"],a:1,e:"La cataracte est la première cause de cécité et elle se traite par chirurgie (phacoémulsification ou extraction extracapsulaire manuelle avec implant).",r:"WHO World report on vision (2019)"},
{g:"SUR",l:"EN",t:"Ophthalmology",q:"A malnourished child complains of difficulty seeing at dusk and has foamy grey patches on the bulbar conjunctiva. Which deficiency is this?",o:["Vitamin B1","Vitamin A","Vitamin C","Vitamin D","Iron"],a:1,e:"Xerophthalmia (night blindness, Bitot spots) can progress to keratomalacia. Treat with high-dose vitamin A.",r:"WHO Xerophthalmia and night blindness guidance"},
{g:"SUR",l:"EN",t:"Anaesthesia & ICU",q:"A septic patient remains hypotensive (MAP 55 mmHg) after 30 mL/kg of crystalloid. What is the first-line vasopressor?",o:["Dopamine","Noradrenaline (norepinephrine)","Phenylephrine","Isoprenaline","Dobutamine"],a:1,e:"Noradrenaline, titrated to a MAP of 65 mmHg or more, is first line. Add vasopressin if needed.",r:"Surviving Sepsis Campaign 2021"},
{g:"SUR",l:"EN",t:"Anaesthesia & ICU",q:"During general anaesthesia with sevoflurane and suxamethonium, a patient develops rising end-tidal CO₂, rigidity, tachycardia and hyperthermia. What is the specific treatment?",o:["Paracetamol","Dantrolene","Neostigmine","Naloxone","Flumazenil"],a:1,e:"Malignant hyperthermia: stop volatile agents, hyperventilate with 100% O₂ and give IV dantrolene 2.5 mg/kg.",r:"AAGBI/EMHG Malignant hyperthermia guideline"},
{g:"SUR",l:"FR",t:"Anesthésie",q:"Après une injection de bupivacaïne pour un bloc périphérique, le patient présente des convulsions puis une arythmie ventriculaire. Quel traitement spécifique ?",o:["Flumazénil","Émulsion lipidique IV à 20 %","Naloxone","Atropine","Glucagon"],a:1,e:"Toxicité systémique des anesthésiques locaux : réanimation standard et émulsion lipidique IV (bolus de 1,5 mL/kg puis perfusion).",r:"AAGBI 2010 / ASRA 2020 LAST checklist"},
{g:"SUR",l:"EN",t:"Emergency",q:"A patient in cardiac arrest is found to be in ventricular fibrillation on the monitor. What is the next step?",o:["IV adrenaline immediately, before anything else","Deliver an unsynchronised shock, then resume CPR for 2 minutes","Synchronised cardioversion","Atropine","Pericardiocentesis"],a:1,e:"Shockable rhythm: defibrillate, then immediate CPR. Give adrenaline 1 mg and amiodarone 300 mg after the 3rd shock.",r:"ERC 2021 / AHA 2020 Resuscitation guidelines"},
{g:"SUR",l:"EN",t:"Anaesthesia & ICU",q:"In which patient is suxamethonium contraindicated because of the risk of severe hyperkalaemia?",o:["A healthy adult having emergency appendicectomy","A patient 5 days after major burns","A patient with a full stomach","A child with tonsillitis","A pregnant woman at term"],a:1,e:"After burns (beyond 24–48 hours), crush injury, denervation and some myopathies, extra acetylcholine receptors cause dangerous potassium release. Use rocuronium instead.",r:"Miller's Anesthesia"},
{g:"SUR",l:"EN",t:"Anaesthesia & ICU",q:"Which ventilation strategy improves survival in ARDS?",o:["High tidal volume, 10–12 mL/kg","Low tidal volume, 6 mL/kg predicted body weight, with plateau pressure below 30 cmH₂O","Zero PEEP","100% oxygen always","Avoiding the prone position"],a:1,e:"Lung-protective ventilation (ARDSNet) plus adequate PEEP and prone positioning in severe ARDS reduces mortality.",r:"ATS/ESICM/SCCM 2017 ARDS guideline"},
{g:"SUR",l:"EN",t:"Plastic surgery",q:"Using the adult 'rule of nines', what percentage of total body surface area is one entire arm?",o:["4.5%","9%","18%","1%","27%"],a:1,e:"Head 9%, each arm 9%, each leg 18%, front of trunk 18%, back of trunk 18%, perineum 1%. The patient's palm (with fingers) is about 1%. Superficial (first-degree) burns are not counted.",r:"ATLS; ISBI Practice guidelines for burn care"},
// ---- MEDICINE (additional) ----
{g:"MED",l:"FR",t:"Dermatologie",q:"Plaques érythémato-squameuses bien limitées des coudes, des genoux et du cuir chevelu, avec atteinte unguéale en « dé à coudre ». Quel est le diagnostic ?",o:["Eczéma atopique","Psoriasis","Pityriasis versicolor","Lichen plan","Dermatite séborrhéique"],a:1,e:"Psoriasis en plaques des convexités. On recherche un rhumatisme psoriasique. Traitement local : dermocorticoïdes et analogues de la vitamine D.",r:"SFD / EADV psoriasis guidelines"},
{g:"MED",l:"EN",t:"Dermatology",q:"A patient has hypopigmented, anaesthetic skin patches and a thickened ulnar nerve. What is the most likely diagnosis?",o:["Vitiligo","Leprosy","Pityriasis versicolor","Tinea corporis","Post-inflammatory hypopigmentation"],a:1,e:"The WHO cardinal signs of leprosy are an anaesthetic skin lesion, a thickened peripheral nerve and positive slit-skin smears. Treat with multidrug therapy.",r:"WHO Guidelines for the diagnosis, treatment and prevention of leprosy (2018)"},
{g:"MED",l:"EN",t:"Dermatology",q:"A patient has intensely itchy papules in the finger webs, wrists and genitals, worse at night, and family members are also itching. What is the treatment?",o:["Oral antibiotics","Topical permethrin 5% for the patient and all close contacts, repeated after 7 days","Topical steroids alone","Oral antifungals","Antihistamines only"],a:1,e:"Scabies (Sarcoptes scabiei): treat all contacts at the same time and wash bedding. Oral ivermectin is an alternative.",r:"WHO Scabies fact sheet; IACS consensus"},
{g:"MED",l:"FR",t:"Dermatologie",q:"Dix jours après le début de la carbamazépine : fièvre, décollement cutané touchant 35 % de la surface corporelle et atteinte des muqueuses. Quel est le diagnostic ?",o:["Érythème polymorphe","Syndrome de Lyell (nécrolyse épidermique toxique)","Urticaire","Érythème pigmenté fixe","Pemphigus vulgaire"],a:1,e:"Nécrolyse épidermique toxique (décollement > 30 %) : arrêt immédiat du médicament, prise en charge en centre spécialisé. Le risque est majoré chez les porteurs de HLA-B*15:02, fréquent en Asie du Sud-Est.",r:"British Association of Dermatologists SJS/TEN guideline (2016)"},
{g:"MED",l:"EN",t:"Dermatology",q:"A painless, indurated genital ulcer with a clean base appears 3 weeks after unprotected sex. What is the treatment?",o:["Acyclovir","Single-dose IM benzathine penicillin G 2.4 MU","Topical antifungal","Oral metronidazole","No treatment"],a:1,e:"Primary syphilis (chancre). Confirm with treponemal and non-treponemal serology (TPHA/VDRL) or dark-field microscopy.",r:"WHO 2016 Syphilis treatment guideline; CDC 2021"},
{g:"MED",l:"EN",t:"Dermatology",q:"A child has honey-coloured crusted lesions around the nose and mouth. What is the most likely diagnosis?",o:["Herpes simplex","Impetigo","Eczema herpeticum","Psoriasis","Scabies"],a:1,e:"Impetigo is caused by S. aureus and/or group A streptococcus. Treat localised disease topically (e.g. fusidic acid), extensive disease orally.",r:"NICE NG153 Impetigo"},
{g:"MED",l:"EN",t:"Dermatology",q:"Which feature of a pigmented skin lesion raises the most concern for melanoma?",o:["Symmetry with regular borders","A uniform light brown colour","Recent change in size, shape or colour","Diameter of 3 mm and stable for years","Presence since birth without change"],a:2,e:"ABCDE: Asymmetry, irregular Border, varied Colour, Diameter over 6 mm, Evolution. Evolution is the most important warning sign. Excise suspicious lesions for histology.",r:"ESMO 2019 Cutaneous melanoma guideline"},
{g:"MED",l:"EN",t:"Dermatology",q:"A patient has itchy, annular, scaly lesions with central clearing and an active edge on the trunk. What is the likely diagnosis and treatment?",o:["Psoriasis: topical steroids","Tinea corporis: topical antifungal (e.g. terbinafine or clotrimazole)","Pityriasis rosea: no treatment","Discoid lupus: hydroxychloroquine","Leprosy: multidrug therapy"],a:1,e:"Dermatophyte infection is confirmed by KOH microscopy. Topical steroids alone make it worse (tinea incognito).",r:"BAD Guidelines for dermatophyte infections"},
{g:"MED",l:"FR",t:"Psychiatrie",q:"Depuis 3 semaines : humeur triste, perte d'intérêt, insomnie, perte d'appétit, sentiment de culpabilité et idées suicidaires. Quel est le diagnostic ?",o:["Trouble anxieux généralisé","Épisode dépressif caractérisé","Trouble bipolaire en phase maniaque","Schizophrénie","Deuil normal"],a:1,e:"Au moins 5 symptômes depuis 2 semaines ou plus, dont une humeur dépressive ou une anhédonie (DSM-5). Il faut toujours évaluer le risque suicidaire.",r:"DSM-5-TR; WHO mhGAP Intervention Guide (2016)"},
{g:"MED",l:"EN",t:"Psychiatry",q:"A 22-year-old has 8 months of hearing voices commenting on his actions, believing his thoughts are being broadcast, and social withdrawal. What is the most likely diagnosis?",o:["Brief psychotic disorder","Schizophrenia","Generalised anxiety","Obsessive-compulsive disorder","Delirium"],a:1,e:"Schizophrenia needs 6 months or more of symptoms including positive symptoms. Always exclude organic causes and substance use (e.g. methamphetamine).",r:"DSM-5-TR; WHO mhGAP"},
{g:"MED",l:"EN",t:"Psychiatry",q:"A patient taking lithium develops vomiting, diarrhoea, coarse tremor, ataxia and confusion after starting a thiazide diuretic. What is happening?",o:["Serotonin syndrome","Lithium toxicity","Neuroleptic malignant syndrome","Hypoglycaemia","Alcohol withdrawal"],a:1,e:"Thiazides, NSAIDs, ACE inhibitors and dehydration raise lithium levels. Stop lithium, give fluids, and consider haemodialysis if severe.",r:"BNF: Lithium; NICE CG185"},
{g:"MED",l:"EN",t:"Psychiatry",q:"A patient on haloperidol develops high fever, 'lead-pipe' rigidity, confusion, autonomic instability and a very high CK. What is the diagnosis?",o:["Serotonin syndrome","Neuroleptic malignant syndrome","Malignant hyperthermia","Meningitis","Acute dystonia"],a:1,e:"NMS: stop the antipsychotic, give supportive ICU care, and consider dantrolene or bromocriptine. Serotonin syndrome causes clonus and hyperreflexia instead.",r:"Maudsley Prescribing Guidelines"},
{g:"MED",l:"FR",t:"Addictologie",q:"Homme alcoolique hospitalisé depuis 48 heures : tremblements, sueurs, agitation, hallucinations visuelles et désorientation. Quel est le traitement ?",o:["Halopéridol seul","Benzodiazépine (diazépam) et thiamine IV","Naltrexone","Disulfirame","Réintroduction d'alcool"],a:1,e:"Delirium tremens : benzodiazépines titrées, thiamine avant tout apport glucosé, réhydratation et correction des électrolytes.",r:"NICE CG100 Alcohol-use disorders; SFA 2015"},
{g:"MED",l:"EN",t:"Psychiatry",q:"A young woman has recurrent episodes of palpitations, sweating, trembling, breathlessness and fear of dying, peaking within 10 minutes, with no cardiac cause. What is the first-line long-term treatment?",o:["Long-term benzodiazepines","SSRI and/or cognitive behavioural therapy","Beta-blocker only","Antipsychotic","No treatment"],a:1,e:"Panic disorder is treated with CBT and/or an SSRI. Avoid long-term benzodiazepines because of dependence.",r:"NICE CG113 Anxiety disorders"},
{g:"MED",l:"EN",t:"Psychiatry",q:"An elderly inpatient becomes acutely confused, with fluctuating attention and disturbed sleep, 2 days after surgery. What is the first priority?",o:["Start an antipsychotic","Find and treat the underlying cause (infection, drugs, pain, retention, hypoxia, electrolytes)","Diagnose dementia","Physically restrain the patient","Discharge home"],a:1,e:"Delirium is an acute brain failure with a medical cause. Use non-drug measures first, and short-term low-dose haloperidol only if distressed or dangerous.",r:"NICE CG103 Delirium"},
{g:"MED",l:"EN",t:"Psychiatry",q:"Which is the most important risk factor for completed suicide?",o:["Female sex","A previous suicide attempt","Young age alone","Being married","High income"],a:1,e:"A previous attempt is the strongest predictor. Other risk factors include male sex, mental disorder, substance use, access to lethal means (e.g. pesticides) and isolation.",r:"WHO Preventing suicide: a global imperative (2014)"},
{g:"MED",l:"EN",t:"Neurology",q:"A 30-year-old woman has painful loss of vision in one eye over days, with pain on eye movement, and years earlier had leg numbness that resolved. What is the most likely diagnosis?",o:["Giant cell arteritis","Multiple sclerosis (optic neuritis)","Migraine","Pituitary tumour","Central retinal artery occlusion"],a:1,e:"Neurological episodes separated in time and space suggest MS. MRI shows periventricular white matter lesions.",r:"McDonald criteria 2017"},
{g:"MED",l:"FR",t:"Neurologie",q:"Ptosis et diplopie fluctuants, aggravés par l'effort en fin de journée, avec fatigabilité musculaire. Quel diagnostic ?",o:["Sclérose latérale amyotrophique","Myasthénie","Syndrome de Guillain-Barré","Myopathie de Duchenne","Parkinson"],a:1,e:"La myasthénie auto-immune (anticorps anti-RACh) est confirmée par l'EMG (décrément). On recherche un thymome au scanner. Traitement : anticholinestérasiques.",r:"International consensus guidance for myasthenia gravis (2020)"},
{g:"MED",l:"EN",t:"Neurology",q:"Two weeks after diarrhoea, a patient has ascending symmetrical weakness with areflexia. CSF protein is raised with normal cell counts. What is the treatment?",o:["High-dose oral steroids","IV immunoglobulin or plasma exchange, with monitoring of vital capacity","Antibiotics","Pyridostigmine","Observation at home"],a:1,e:"Guillain-Barré syndrome (often after Campylobacter). Monitor for respiratory failure. Steroids do not help.",r:"EAN/PNS 2023 Guillain-Barré syndrome guideline"},
{g:"MED",l:"EN",t:"Neurology",q:"A 65-year-old has a resting pill-rolling tremor, bradykinesia and cogwheel rigidity starting on one side. What is the most effective symptomatic drug?",o:["Haloperidol","Levodopa with carbidopa","Propranolol","Donepezil","Carbamazepine"],a:1,e:"Levodopa is the most effective treatment for Parkinson's disease. Avoid dopamine-blocking drugs such as haloperidol and metoclopramide.",r:"NICE NG71 Parkinson's disease"},
{g:"MED",l:"EN",t:"Neurology",q:"A patient has had continuous generalised tonic-clonic seizures for 7 minutes. What is the first-line drug?",o:["IV phenytoin first","A benzodiazepine (IV lorazepam or diazepam, or buccal/IM midazolam)","IV propofol","Oral valproate","Haloperidol"],a:1,e:"Status epilepticus: give a benzodiazepine at 5 minutes and repeat once. Second line is IV levetiracetam, valproate or phenytoin, then anaesthesia.",r:"ESETT trial; NICE NG217 Epilepsies"},
{g:"MED",l:"EN",t:"Cardiology",q:"A patient has shortness of breath, orthopnoea, raised JVP, bibasal crackles and an ejection fraction of 30%. Which drug class is NOT part of the four prognostic pillars?",o:["ACE inhibitor/ARB or ARNI (sacubitril-valsartan)","Beta-blocker (bisoprolol or carvedilol)","Mineralocorticoid receptor antagonist","SGLT2 inhibitor","Digoxin"],a:4,e:"Digoxin improves symptoms but not survival. The four pillars reduce mortality in heart failure with reduced ejection fraction.",r:"ESC 2021/2023 Heart failure guidelines"},
{g:"MED",l:"FR",t:"Cardiologie",q:"Douleur thoracique augmentée à l'inspiration, soulagée en position penchée en avant, avec un sus-décalage ST diffus concave et un sous-décalage de PQ. Quel diagnostic ?",o:["Infarctus antérieur","Péricardite aiguë","Embolie pulmonaire","Dissection aortique","Pneumothorax"],a:1,e:"Péricardite aiguë : AINS (ou aspirine) et colchicine pendant 3 mois pour réduire les récidives. On cherche un épanchement à l'échographie.",r:"ESC 2015 Pericardial diseases guidelines"},
{g:"MED",l:"EN",t:"Cardiology",q:"A hypertensive man has sudden tearing chest pain radiating to the back, a BP difference of 30 mmHg between his arms and a wide mediastinum. What is the most likely diagnosis?",o:["Myocardial infarction","Acute aortic dissection","Pericarditis","Oesophageal spasm","Pneumonia"],a:1,e:"Confirm by CT angiography. Type A (ascending aorta) needs emergency surgery. Control BP and heart rate with IV beta-blockers.",r:"ESC 2014 / ACC-AHA 2022 Aortic disease guidelines"},
{g:"MED",l:"EN",t:"Cardiology",q:"A patient with mitral stenosis from rheumatic heart disease develops atrial fibrillation. What is the recommended anticoagulant?",o:["No anticoagulation","A vitamin K antagonist (warfarin)","A DOAC (rivaroxaban)","Aspirin","Clopidogrel"],a:1,e:"In moderate-to-severe rheumatic mitral stenosis with AF, warfarin is superior to rivaroxaban (INVICTUS trial). Rheumatic heart disease remains common in low-income countries.",r:"INVICTUS trial (NEJM 2022); ESC 2021 Valvular guidelines"},
{g:"MED",l:"EN",t:"Cardiology",q:"Which is the most common cause of infective endocarditis in injection drug users, and which valve does it usually affect?",o:["Streptococcus viridans; mitral valve","Staphylococcus aureus; tricuspid valve","Enterococcus; aortic valve","Candida; pulmonary valve","Coxiella; mitral valve"],a:1,e:"Right-sided S. aureus endocarditis causes septic pulmonary emboli. Diagnose with blood cultures and echocardiography (Duke criteria).",r:"ESC 2023 Endocarditis guidelines"},
{g:"MED",l:"FR",t:"Cardiologie",q:"ECG : QRS larges, onde P absente, rythme régulier à 180/min chez un patient hémodynamiquement instable (PA 70/40, confusion). Quel traitement immédiat ?",o:["Amiodarone orale","Choc électrique externe synchronisé","Adénosine en première intention","Massage sino-carotidien","Digoxine"],a:1,e:"Tachycardie à QRS larges mal tolérée : cardioversion électrique synchronisée immédiate.",r:"ERC 2021 Adult advanced life support"},
{g:"MED",l:"EN",t:"Respiratory",q:"A 25-year-old tall, thin man has sudden pleuritic chest pain and breathlessness. X-ray shows a 3 cm primary spontaneous pneumothorax, and he is stable. What is the management?",o:["Immediate thoracotomy","Needle aspiration (or conservative management if minimally symptomatic)","Intubation","Chest drain in all cases","Anticoagulation"],a:1,e:"Primary spontaneous pneumothorax: conservative care or aspiration depending on symptoms. Tension pneumothorax needs immediate decompression.",r:"BTS 2023 Pleural disease guideline"},
{g:"MED",l:"EN",t:"Respiratory",q:"Pleural fluid protein is 40 g/L with serum protein 60 g/L, and pleural LDH is high. According to Light's criteria, what kind of effusion is this?",o:["Transudate (e.g. heart failure)","Exudate (e.g. infection, malignancy, TB)","Chylothorax","Haemothorax","Cannot be classified"],a:1,e:"The pleural/serum protein ratio above 0.5 means an exudate. In Cambodia, consider TB and malignancy.",r:"Light's criteria; BTS 2023 Pleural disease guideline"},
{g:"MED",l:"EN",t:"Respiratory",q:"Which drug reduces the risk of COPD exacerbations in a patient with frequent exacerbations and eosinophils of 350/µL?",o:["Short-acting beta-agonist alone","LABA + LAMA + inhaled corticosteroid","Oral theophylline alone","Long-term oral steroids","Antibiotics every month"],a:1,e:"GOLD recommends triple therapy when exacerbations persist on LABA+LAMA and blood eosinophils are 300/µL or more. Stopping smoking and vaccination matter most.",r:"GOLD 2024 Report"},
{g:"MED",l:"FR",t:"Pneumologie",q:"Patient sous traitement antituberculeux présentant une baisse de l'acuité visuelle et une dyschromatopsie rouge-vert. Quel médicament est en cause ?",o:["Isoniazide","Rifampicine","Éthambutol","Pyrazinamide","Streptomycine"],a:2,e:"L'éthambutol donne une névrite optique rétrobulbaire. L'isoniazide cause des neuropathies (prévenues par la pyridoxine), la rifampicine colore les urines, le pyrazinamide provoque une hyperuricémie.",r:"WHO TB treatment guidelines; BNF"},
{g:"MED",l:"EN",t:"Gastroenterology",q:"A patient has chronic dyspepsia and a gastric ulcer, and a urea breath test for Helicobacter pylori is positive. What is the recommended treatment?",o:["PPI alone for 4 weeks","PPI-based triple or quadruple therapy for 14 days, then confirm eradication","Antacids only","Surgery","Antibiotics without a PPI"],a:1,e:"Eradication reduces ulcer recurrence and gastric cancer risk. Local clarithromycin resistance guides the choice (bismuth quadruple where resistance is high).",r:"Maastricht VI/Florence consensus (2022)"},
{g:"MED",l:"FR",t:"Hépato-gastro",q:"Cirrhotique confus, avec astérixis (flapping tremor), après une hémorragie digestive. Quel traitement de première intention ?",o:["Benzodiazépines","Lactulose (et rifaximine)","Diurétiques à forte dose","Régime sans protéines strict","Morphine"],a:1,e:"L'encéphalopathie hépatique se traite par lactulose (objectif 2–3 selles molles/j) et correction du facteur déclenchant : saignement, infection, sédatifs, hypokaliémie.",r:"EASL 2022 Hepatic encephalopathy guideline"},
{g:"MED",l:"EN",t:"Gastroenterology",q:"A young man has bloody diarrhoea for 6 weeks. Colonoscopy shows continuous mucosal inflammation from the rectum upwards. What is the most likely diagnosis?",o:["Crohn's disease","Ulcerative colitis","Amoebic colitis only","Irritable bowel syndrome","Ischaemic colitis"],a:1,e:"Ulcerative colitis starts in the rectum and extends continuously. Crohn's disease shows skip lesions and transmural, granulomatous inflammation. Always exclude infection (amoebiasis, TB) first in Cambodia.",r:"ECCO 2022 Ulcerative colitis guidelines"},
{g:"MED",l:"EN",t:"Hepatology",q:"A patient develops acute hepatitis after drinking water during floods. Which virus spreads by the faecal–oral route and is dangerous in pregnancy?",o:["Hepatitis B","Hepatitis C","Hepatitis E","Hepatitis D","Hepatitis G"],a:2,e:"Hepatitis E (like A) spreads faecal–orally. It can cause fulminant hepatic failure with high mortality in the third trimester.",r:"WHO Hepatitis E fact sheet; EASL 2018 HEV"},
{g:"MED",l:"FR",t:"Hépatologie",q:"Patient avec hépatite C chronique. Quel est le traitement actuel recommandé par l'OMS ?",o:["Interféron pégylé et ribavirine pendant 48 semaines","Antiviraux à action directe pangénotypiques (sofosbuvir + daclatasvir ou sofosbuvir/velpatasvir) pendant 12 semaines","Lamivudine","Ténofovir","Aucun traitement"],a:1,e:"Les AAD guérissent plus de 95 % des patients. Le Cambodge a élargi l'accès au traitement de l'hépatite C.",r:"WHO Guidelines for care and treatment of hepatitis C (2018, 2022)"},
{g:"MED",l:"EN",t:"Endocrinology",q:"An elderly type 2 diabetic has glucose of 45 mmol/L, osmolality of 350 mOsm/kg, confusion, severe dehydration and no significant ketones. What is the diagnosis?",o:["Diabetic ketoacidosis","Hyperosmolar hyperglycaemic state","Lactic acidosis","Hypoglycaemia","SIADH"],a:1,e:"HHS: rehydrate slowly with 0.9% saline first and use low-dose insulin only once glucose stops falling with fluids. Watch for thrombosis.",r:"JBDS 2022 Hyperosmolar hyperglycaemic state guideline"},
{g:"MED",l:"EN",t:"Endocrinology",q:"A patient has central obesity, purple striae, proximal myopathy, hypertension and easy bruising. What is the best initial screening test for Cushing's syndrome?",o:["Random cortisol","Overnight 1 mg dexamethasone suppression test (or late-night salivary cortisol, 24-hour urinary free cortisol)","ACTH stimulation test","CT adrenals","Serum potassium"],a:1,e:"First confirm hypercortisolism, then measure ACTH to localise the cause. The most common cause overall is exogenous steroids.",r:"Endocrine Society 2008/2021 Cushing's syndrome guidelines"},
{g:"MED",l:"FR",t:"Endocrinologie",q:"Hypertension artérielle résistante avec hypokaliémie spontanée. Quel diagnostic faut-il rechercher en premier ?",o:["Phéochromocytome","Hyperaldostéronisme primaire","Maladie d'Addison","Hypothyroïdie","Syndrome de Conn exclu par la kaliémie"],a:1,e:"Dépistage par le rapport aldostérone/rénine. L'adénome de Conn relève de la chirurgie ; l'hyperplasie bilatérale se traite par spironolactone.",r:"Endocrine Society 2016 Primary aldosteronism guideline"},
{g:"MED",l:"EN",t:"Endocrinology",q:"Which HbA1c value is diagnostic of diabetes, according to WHO, when confirmed?",o:["≥ 5.7%","≥ 6.0%","≥ 6.5% (48 mmol/mol)","≥ 7.5%","≥ 8.0%"],a:2,e:"Other criteria: fasting glucose ≥ 7.0 mmol/L, 2-hour OGTT glucose ≥ 11.1, or random glucose ≥ 11.1 with symptoms. HbA1c is unreliable in haemoglobinopathies, which are common in Cambodia.",r:"WHO 2011 Use of HbA1c in the diagnosis of diabetes"},
// ---- BASIC SCIENCES (additional) ----
{g:"BS",l:"EN",t:"Anatomy",q:"A patient cannot initiate abduction of the shoulder, but once the arm is passively raised past 15°, abduction strength is near normal. Which muscle is injured?",o:["Deltoid","Supraspinatus","Infraspinatus","Teres minor","Biceps"],a:1,e:"Supraspinatus starts abduction (0–15°). Deltoid then takes over, and trapezius and serratus anterior rotate the scapula above 90°.",r:"Moore, Clinically Oriented Anatomy"},
{g:"BS",l:"FR",t:"Anatomie",q:"Quel nerf innerve le muscle diaphragme ?",o:["Nerf vague","Nerf phrénique (C3, C4, C5)","Nerf intercostal T6","Nerf accessoire","Nerf hypoglosse"],a:1,e:"« C3, 4, 5 keep the diaphragm alive ». Une irritation diaphragmatique peut donner une douleur projetée à l'épaule (C4).",r:"Rouvière, Anatomie humaine"},
{g:"BS",l:"EN",t:"Anatomy",q:"Where should a chest drain be inserted in an adult (the 'safe triangle')?",o:["2nd intercostal space, midclavicular line, below the rib","4th–5th intercostal space, anterior-to-mid axillary line, just above the upper border of the rib below","7th intercostal space, posterior","Left parasternal edge, 5th space","Any space, directly below a rib"],a:1,e:"The neurovascular bundle runs in the subcostal groove, under the lower border of each rib. Pass instruments just above the rib below.",r:"BTS 2023 Pleural procedures; ATLS"},
{g:"BS",l:"EN",t:"Anatomy",q:"Which structure lies directly behind the laryngeal prominence (Adam's apple)?",o:["Cricoid cartilage","Thyroid cartilage","Hyoid bone","Epiglottis","Thyroid gland isthmus"],a:1,e:"The laryngeal prominence is formed by the laminae of the thyroid cartilage. The cricothyroid membrane, between thyroid and cricoid cartilages, is the site for emergency cricothyroidotomy.",r:"Gray's Anatomy"},
{g:"BS",l:"FR",t:"Physiologie",q:"Quelle hormone augmente l'absorption intestinale du calcium ?",o:["Calcitonine","1,25-dihydroxyvitamine D (calcitriol)","Aldostérone","Insuline","Glucagon"],a:1,e:"Le calcitriol, activé dans le rein sous l'effet de la PTH, augmente l'absorption digestive du calcium et du phosphate.",r:"Guyton & Hall, Physiologie médicale"},
{g:"BS",l:"EN",t:"Physiology",q:"Which change shifts the oxygen–haemoglobin dissociation curve to the right, making oxygen easier to release to tissues?",o:["Low temperature","Alkalosis (high pH)","Increased 2,3-DPG","Low PaCO₂","Carbon monoxide"],a:2,e:"Right-shift factors: raised CO₂, acidosis (Bohr effect), raised temperature and raised 2,3-DPG. Fetal Hb and CO shift the curve left.",r:"West's Respiratory Physiology"},
{g:"BS",l:"EN",t:"Physiology",q:"Which cells of the stomach secrete intrinsic factor, needed for vitamin B12 absorption?",o:["Chief cells","Parietal cells","G cells","Mucous neck cells","D cells"],a:1,e:"Parietal cells secrete HCl and intrinsic factor. Chief cells make pepsinogen, G cells gastrin, D cells somatostatin. B12 is absorbed in the terminal ileum.",r:"Guyton & Hall"},
{g:"BS",l:"EN",t:"Physiology",q:"Where in the nephron is most filtered sodium reabsorbed?",o:["Proximal convoluted tubule (about 65%)","Loop of Henle","Distal convoluted tubule","Collecting duct","Glomerulus"],a:0,e:"The PCT reabsorbs about 65% of Na⁺, the thick ascending limb about 25% (loop diuretics act here), the DCT about 5% (thiazides) and the collecting duct 2–3% (aldosterone, amiloride).",r:"Guyton & Hall"},
{g:"BS",l:"FR",t:"Biochimie",q:"Quel déficit enzymatique est responsable de la phénylcétonurie ?",o:["Glucose-6-phosphatase","Phénylalanine hydroxylase","Hexosaminidase A","Galactose-1-phosphate uridyltransférase","Homogentisate oxydase"],a:1,e:"Transmission autosomique récessive, dépistée à la naissance. Un régime pauvre en phénylalanine prévient le retard mental.",r:"Harper's Illustrated Biochemistry"},
{g:"BS",l:"EN",t:"Pharmacology",q:"Which antibiotic class works by inhibiting bacterial DNA gyrase (topoisomerase II)?",o:["Beta-lactams","Fluoroquinolones (e.g. ciprofloxacin)","Macrolides","Aminoglycosides","Tetracyclines"],a:1,e:"Beta-lactams inhibit cell wall synthesis. Macrolides (50S), aminoglycosides (30S) and tetracyclines (30S) inhibit protein synthesis.",r:"Goodman & Gilman's"},
{g:"BS",l:"EN",t:"Pharmacology",q:"A patient on warfarin starts a new drug and his INR rises from 2.5 to 7. Which drug most likely caused this?",o:["Rifampicin","Carbamazepine","Metronidazole (or fluconazole)","Phenytoin long-term","Vitamin K-rich vegetables"],a:2,e:"Metronidazole, fluconazole, ciprofloxacin and amiodarone inhibit warfarin metabolism (CYP2C9/3A4). Rifampicin and carbamazepine are enzyme inducers and lower the INR.",r:"BNF Interactions; Stockley's Drug Interactions"},
{g:"BS",l:"EN",t:"Pharmacology",q:"What is the half-life of a drug?",o:["The time to reach peak concentration","The time for the plasma concentration to fall by 50%","The time for complete elimination","The dose interval","The time to onset of action"],a:1,e:"Steady state is reached after about 4–5 half-lives, which is why loading doses are used for drugs with long half-lives.",r:"Rang & Dale's Pharmacology"},
{g:"BS",l:"FR",t:"Pharmacologie",q:"Quel est l'effet indésirable principal des aminosides administrés avec le furosémide ?",o:["Hépatite","Ototoxicité majorée","Hypertension","Hyperglycémie","Photosensibilité"],a:1,e:"Les diurétiques de l'anse et les aminosides ont une ototoxicité additive. La néphrotoxicité est également majorée.",r:"Vidal; BNF"},
{g:"BS",l:"EN",t:"Microbiology",q:"A patient develops watery diarrhoea after a course of clindamycin. Which organism is most likely?",o:["Salmonella enteritidis","Clostridioides difficile","Vibrio cholerae","Staphylococcus aureus enterotoxin","Rotavirus"],a:1,e:"Antibiotic-associated colitis is treated with oral vancomycin or fidaxomicin. Stop the causative antibiotic.",r:"IDSA/SHEA 2021 C. difficile guideline"},
{g:"BS",l:"EN",t:"Microbiology",q:"Which organism causes profuse 'rice-water' diarrhoea with rapid dehydration during outbreaks?",o:["Shigella","Vibrio cholerae","Entamoeba histolytica","Giardia","Campylobacter"],a:1,e:"Cholera toxin activates adenylate cyclase and causes massive secretory diarrhoea. Rapid rehydration is life-saving; antibiotics (doxycycline or azithromycin) shorten the illness.",r:"WHO Cholera fact sheet; GTFCC"},
{g:"BS",l:"FR",t:"Microbiologie",q:"Quel examen confirme le diagnostic de tuberculose pulmonaire, avec détection de la résistance à la rifampicine, selon l'OMS ?",o:["IDR à la tuberculine","Test moléculaire rapide (Xpert MTB/RIF)","Radiographie thoracique seule","Sérologie","VS"],a:1,e:"Les tests moléculaires rapides sont recommandés en première intention. L'IDR et l'IGRA dépistent l'infection latente mais ne diagnostiquent pas la maladie active.",r:"WHO consolidated TB guidelines, Module 3: diagnosis (2021)"},
{g:"BS",l:"EN",t:"Immunology",q:"Which type of hypersensitivity is the tuberculin skin (Mantoux) reaction?",o:["Type I (IgE)","Type II (antibody against cell surface)","Type III (immune complex)","Type IV (delayed, T-cell mediated)","Anaphylactoid"],a:3,e:"Type IV reactions peak at 48–72 hours. Other examples: contact dermatitis and transplant rejection.",r:"Janeway's Immunobiology"},
{g:"BS",l:"EN",t:"Genetics",q:"A disease affects males much more than females, is passed from carrier mothers to half of their sons and is never transmitted from father to son. What is the inheritance pattern?",o:["Autosomal dominant","Autosomal recessive","X-linked recessive","Mitochondrial","Y-linked"],a:2,e:"Examples: haemophilia A and B, Duchenne muscular dystrophy and G6PD deficiency.",r:"Thompson & Thompson Genetics in Medicine"},
{g:"BS",l:"FR",t:"Santé publique",q:"Le taux de mortalité infantile correspond au nombre de décès :",o:["D'enfants de moins de 5 ans pour 1 000 naissances vivantes","D'enfants de moins de 1 an pour 1 000 naissances vivantes","De nouveau-nés de moins de 28 jours pour 1 000 naissances","De mères pour 100 000 naissances vivantes","D'enfants de 1 à 4 ans pour 1 000 enfants"],a:1,e:"Mortalité infantile : décès avant 1 an pour 1 000 naissances vivantes. Mortalité néonatale : avant 28 jours. Mortalité infanto-juvénile : avant 5 ans.",r:"WHO Global Health Observatory definitions"},
{g:"BS",l:"EN",t:"Statistics",q:"Which study design best establishes whether a new drug causes a reduction in mortality?",o:["Case report","Cross-sectional survey","Case-control study","Randomised controlled trial","Ecological study"],a:3,e:"Randomisation balances known and unknown confounders. Systematic reviews of RCTs sit at the top of the evidence hierarchy.",r:"Oxford CEBM Levels of Evidence"},
// ---- RADIOLOGY & PATHOLOGY ----
{g:"ONC",l:"EN",t:"Radiology",q:"Which imaging modality exposes the patient to NO ionising radiation?",o:["CT","Plain radiography","MRI","Mammography","PET-CT"],a:2,e:"MRI and ultrasound use no ionising radiation, so they are preferred in pregnancy and children where possible. Check for pacemakers and metal before MRI.",r:"ICRP; ACR Manual on MR safety"},
{g:"ONC",l:"EN",t:"Radiology",q:"A patient needs contrast-enhanced CT but has an eGFR of 25 mL/min and takes metformin. What is the best practice?",o:["Proceed without precautions","Consider alternative imaging; if contrast is essential, give IV hydration and withhold metformin for 48 hours after","Give double contrast","Use oral contrast only in all cases","Cancel all imaging"],a:1,e:"Reduce the risk of contrast-associated AKI in severe renal impairment. Metformin is withheld because of lactic acidosis risk if AKI develops.",r:"ESUR 2018 Contrast media guidelines; ACR Manual on Contrast Media"},

/* Assign domain groups to the original items that used the older A/B/C parts. */
Q.forEach(q=>{ if(q.g) return;
  if(q.s==="A") q.g="MED";
  else if(q.s==="C") q.g="ONC";
  else { const t=q.t||"";
    if(/Anatomy|Physiology|Biochemistry|Pharmacology|Toxicology|Microbiology|Immunology|Statistics|Ethics/.test(t)) q.g="BS";
    else if(/Surgery|Emergency/.test(t)) q.g=/anaphylaxis|stridor, urticaria/i.test(q.q)?"MED":"SUR";
    else if(/Obstetrics/.test(t)) q.g="OBG";
    else q.g="MED"; }
});

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(k){return Q.map((q,i)=>q.g===k?i:-1).filter(i=>i>=0)}

function newPaper(len,focus){
  const scale=len/100, seen=new Set(S.seen||[]);
  let picks=[];
  GROUPS.forEach(g=>{
    const want=Math.max(1,Math.round(g.take*scale));
    const all=pool(g.k), fresh=shuffle(all.filter(i=>!seen.has(i))), old=shuffle(all.filter(i=>seen.has(i)));
    picks.push(...fresh.concat(old).slice(0,Math.min(want,all.length)));
  });
  while(picks.length<len){const rest=shuffle(Q.map((_,i)=>i).filter(i=>!picks.includes(i)));if(!rest.length)break;picks.push(rest[0])}
  picks=picks.slice(0,len);
  // Order like a real paper: grouped by domain, shuffled within each domain
  const order=GROUPS.map(g=>g.k);
  picks.sort((a,b)=>order.indexOf(Q[a].g)-order.indexOf(Q[b].g)||Math.random()-.5);
  return picks.map(i=>({i,ord:shuffle([0,1,2,3,4])}));
}

let S=load()||fresh();
function fresh(){const s=load();return{screen:"start",mode:"exam",mins:120,len:100,cur:0,ans:{},flag:{},left:null,paper:[],attempt:(s&&s.attempt)||0,seen:(s&&s.seen)||[],history:(s&&s.history)||[],gpa:(s&&s.gpa)||"",filter:"all",confirm:false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.screen?s:null}catch(e){return null}}

const item=j=>{const p=S.paper[j],q=Q[p.i];return{q,opts:p.ord.map(k=>q.o[k]),correct:p.ord.indexOf(q.a)}};

function render(){

  return renderResults(S,false);
}

function fmt(s){s=Math.max(0,s|0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}

function startTick(){
  clearInterval(tick);
  if(S.mode!=="exam"||S.screen!=="exam")return;
  tick=setInterval(()=>{S.left--;const t=document.getElementById("timer");if(t){t.textContent=fmt(S.left);t.classList.toggle("low",S.left<600)}
    if(S.left%10===0)save();if(S.left<=0)finish()},1000);
}

function score(){let r=0;S.paper.forEach((p,j)=>{if(S.ans[j]===p.ord.indexOf(Q[p.i].a))r++});return r}

function finish(){
  clearInterval(tick);
  const r=score(), d=new Date();
  S.seen=[...new Set((S.seen||[]).concat(S.paper.map(p=>p.i)))];
  S.history=(S.history||[]).concat([{n:S.attempt,score:r,len:S.paper.length,date:d.toLocaleDateString()}]).slice(-30);
  const snap={id:String(Date.now()),n:S.attempt,score:r,len:S.paper.length,mode:S.mode,mins:S.mins,left:S.left,
    date:d.toLocaleDateString()+" "+d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),
    paper:S.paper.map(p=>({i:p.i,ord:p.ord,k:Q[p.i].q.slice(0,40)})),ans:S.ans,flag:S.flag};
  PAPERS=PAPERS.concat([snap]).slice(-PMAX);
  while(!savePapers(PAPERS)&&PAPERS.length>1)PAPERS=PAPERS.slice(1);
  S.screen="results";S.confirm=false;S.filter="all";S.done=true;save();render();window.scrollTo({top:0})
}

  <p class="muted">${pct}% · ${skipped} unanswered · time used ${used} of ${R.mode==="exam"?R.mins+" min":"untimed practice"}${missing?` · ${missing} question(s) no longer in the bank`:""}${saved?"":" · saved under Your previous papers"}</p>

    ${GROUPS.filter(x=>tot[x.k][1]).map(x=>{const p=Math.round(tot[x.k][0]/tot[x.k][1]*100);return `<div><span>${esc(x.n)}</span><b>${tot[x.k][0]}/${tot[x.k][1]}</b><div class="bar"><i style="width:${p}%"></i></div></div>`}).join("")}

      <div class="gpa"><label for="gpa" style="font-size:12.5px">Your GPA /4.0</label><input id="gpa" inputmode="decimal" value="${esc(S.gpa)}" placeholder="3.2"></div></div>
  </div>
  <p class="note" style="margin-top:14px">Weakest areas on this paper: <b>${weak.map(w=>esc(w.x.n)+" ("+Math.round(w.p*100)+"%)").join(", ")}</b>. DES places are awarded by rank within each specialty, so there is no fixed pass mark.</p>
  <div class="filters seg" id="filters">
    ${[["all","All"],["bad","Wrong"],["skip","Unanswered"],["flag","Flagged"],["ok","Correct"]].concat(GROUPS.map(x=>[x.k,x.n])).map(([k,l])=>`<button aria-pressed="${S.filter===k}" data-f="${k}">${esc(l)}</button>`).join("")}
  </div>
  <div class="review">
    ${list.map(({q,p,j,c,a,st})=>`<article class="rv ${st}">
      <div class="qmeta"><span class="qnum">Q${j+1}</span><span class="chip">${esc(GNAME[q.g].n)}</span><span class="chip lang">${q.l}</span>${q.t?`<span class="chip">${esc(q.t)}</span>`:""}${FLAG[j]?`<span class="chip" style="color:var(--flag);border-color:var(--flag)">flagged</span>`:""}</div>
      <div class="stem">${esc(q.q)}</div>
      <ol>${p.ord.map((k,x)=>`<li class="${x===c?"c":(x===a?"y":"")}">${LET[x]}. ${esc(q.o[k])}${x===a?" ← your answer":""}</li>`).join("")}</ol>${a==null?`<p class="muted" style="margin:6px 0 0;font-size:13px">You didn't answer this question.</p>`:""}
      <div class="explain">${esc(q.e)}<div class="src">Source: ${esc(q.r)}</div></div>
    </article>`).join("")||`<p class="muted">Nothing in this filter.</p>`}
  </div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:24px">
    ${saved?"":`<button class="btn" id="again">Deal a new paper</button>`}
    <button class="btn ${saved?"":"ghost"}" id="home">Back to start</button>
  </div>
  <footer>Unofficial practice paper, not affiliated with the University of Health Sciences. Check anything that looks wrong against the cited guideline.</footer>`;
  document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;save();render()});
  const gi=document.getElementById("gpa");gi.onchange=()=>{S.gpa=gi.value.trim();save();render()};
  const bk=document.getElementById("back");if(bk)bk.onclick=()=>{S.screen="start";S.reviewId=null;save();render();window.scrollTo({top:0})};
  const ag=document.getElementById("again");if(ag)ag.onclick=()=>{const keep={mode:S.mode,mins:S.mins,len:S.len,attempt:S.attempt+1,seen:S.seen,history:S.history,gpa:S.gpa};
    S=Object.assign(fresh(),keep);S.paper=newPaper(S.len);S.screen="exam";S.left=S.mins*60;S.done=false;save();render();window.scrollTo({top:0})};
  document.getElementById("home").onclick=()=>{S.screen="start";S.reviewId=null;save();render();window.scrollTo({top:0})};
}

if(S.screen==="exam"&&(!S.paper||!S.paper.length))S.screen="start";
render();
</script>
</body>
</html>
